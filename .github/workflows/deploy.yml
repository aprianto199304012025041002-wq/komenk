name: Deploy ke Hostinger via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v3

      - name: Buat komenk_config.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          SSO_CLIENT_ID: ${{ secrets.SSO_CLIENT_ID }}
          SSO_PUBLIC_KEY: ${{ secrets.SSO_PUBLIC_KEY }}
        run: |
          php -r "
            \$key = getenv('SSO_PUBLIC_KEY');
            \$config = '<?php' . PHP_EOL
              . \"define('DB_HOST',         '\" . getenv('DB_HOST') . \"');\" . PHP_EOL
              . \"define('DB_NAME',         '\" . getenv('DB_NAME') . \"');\" . PHP_EOL
              . \"define('DB_USER',         '\" . getenv('DB_USER') . \"');\" . PHP_EOL
              . \"define('DB_PASS',         '\" . getenv('DB_PASS') . \"');\" . PHP_EOL
              . \"define('DB_CHARSET',      'utf8mb4');\" . PHP_EOL
              . \"define('SSO_URL',         'https://gudeg.xo.je/sso.php');\" . PHP_EOL
              . \"define('SSO_CLIENT_ID',   '\" . getenv('SSO_CLIENT_ID') . \"');\" . PHP_EOL
              . \"define('SSO_CALLBACK_URL','https://komenk.balmonjogja.info/callback.php');\" . PHP_EOL
              . \"define('APP_NAME',        'komenk');\" . PHP_EOL
              . \"define('APP_BASE_URL',    'https://komenk.balmonjogja.info');\" . PHP_EOL
              . \"define('SSO_PUBLIC_KEY',  \" . var_export(\$key, true) . \");\" . PHP_EOL;
            file_put_contents('komenk_config.php', \$config);
            echo 'OK' . PHP_EOL;
          "

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 21
          security: loose
          local-dir: ./
          server-dir: /public_html/
          state-name: ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.gitignore
            **/.htaccess
